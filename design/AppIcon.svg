<?xml version="1.0" encoding="UTF-8"?>
<!-- Sill Desktop's icon: a Mac's display at the back, its window on a laptop in front. In the
     family of Sill's icon (dark tile, grey hardware), not a copy of it. The tile is drawn here
     with macOS's margin, since neither macOS nor Windows masks an icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26272c"/><stop offset="1" stop-color="#08080a"/></linearGradient>
<linearGradient id="grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c7e86"/><stop offset="1" stop-color="#4c4e56"/></linearGradient>
<linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9ccd4"/><stop offset="1" stop-color="#8b8e97"/></linearGradient>
<filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter>
</defs>
<g id="tile">
<rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
<rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="3"/>
</g>
<g transform="translate(-14 28)">
<g id="mac">
<rect x="318" y="600" width="204" height="30" rx="15" fill="url(#grey)"/>
<rect x="392" y="540" width="56" height="70" fill="url(#grey)"/>
<rect x="190" y="220" width="460" height="330" rx="44" fill="url(#grey)"/>
<rect x="212" y="242" width="416" height="262" rx="24" fill="#07080a"/>
<rect x="191.5" y="221.5" width="457" height="327" rx="42.5" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="3"/>
</g>
<g id="laptop" filter="url(#lift)">
<rect x="392" y="412" width="420" height="290" rx="30" fill="#2a2f3a"/>
<rect x="393.5" y="413.5" width="417" height="287" rx="28.5" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="3"/>
<path d="M342 702h520v14a30 30 0 0 1-30 30H372a30 30 0 0 1-30-30z" fill="url(#base)"/>
<rect x="552" y="702" width="100" height="14" rx="7" fill="#6b6e77"/>
</g>
<g id="window">
<rect x="414" y="434" width="376" height="246" rx="14" fill="#f7f8fa"/>
<path d="M414 448a14 14 0 0 1 14-14h348a14 14 0 0 1 14 14v38H414z" fill="#7ea2ff"/>
<circle cx="444" cy="460" r="9" fill="#fff" fill-opacity="0.85"/>
<circle cx="472" cy="460" r="9" fill="#fff" fill-opacity="0.6"/>
<circle cx="500" cy="460" r="9" fill="#fff" fill-opacity="0.4"/>
<rect x="444" y="520" width="190" height="18" rx="9" fill="#5a5f6b"/>
<rect x="444" y="562" width="270" height="18" rx="9" fill="#5a5f6b" fill-opacity="0.55"/>
<rect x="444" y="604" width="140" height="18" rx="9" fill="#5a5f6b" fill-opacity="0.55"/>
</g>
</g>
</svg>
